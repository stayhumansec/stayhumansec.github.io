name: Regenerate feeds

on:
  push:
    branches: [main]
    paths:
      - posts.json
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate sitemap.xml and feed.xml
        run: python3 scripts/generate_feeds.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml feed.xml
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Regenerate sitemap.xml and feed.xml from posts.json [skip ci]"
            git push
          fi
